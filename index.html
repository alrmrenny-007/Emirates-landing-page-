<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emirates | Fly Better</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- Self-hosted fonts: download the Inter and Fraunces .woff2 files from
         Google Fonts and reference them here with @font-face instead of the
         Google Fonts CDN link, e.g.:
         <link rel="stylesheet" href="./fonts/fonts.css" /> -->
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <div id="root"></div>

    <!-- Vendored locally: copy these from node_modules/react(-dom)/umd/
         after running `npm install`, instead of pulling from unpkg -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <!-- Vendor lucide icons the same way, from node_modules/lucide -->
    <script src="./vendor/lucide.min.js"></script>

    <!-- Precompiled from src/app.jsx via `npm run build:js` — no in-browser
         Babel needed at runtime -->
    <script src="./app.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
