<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emirates | Fly Better</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://d8j0ntlcm91z4.cloudfront.net" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .hero-video {
        object-fit: cover;
        width: 100%;
        height: 100%;
      }
      .glass-nav {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
      }
      .section-fade {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s ease-out;
      }
      .section-fade.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .card-hover {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .card-hover:hover {
        transform: translateY(-8px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      }
      .btn-primary {
        background: #c60c30;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background: #9e0a26;
        transform: translateY(-2px);
      }
      .btn-secondary {
        background: transparent;
        border: 2px solid #c60c30;
        color: #c60c30;
        transition: all 0.3s ease;
      }
      .btn-secondary:hover {
        background: #c60c30;
        color: white;
      }
      .gradient-overlay {
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.7) 0%,
          rgba(0, 0, 0, 0.2) 50%,
          transparent 100%
        );
      }
      .tier-card {
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .fleet-card {
        position: relative;
        overflow: hidden;
      }
      .fleet-card img {
        transition: transform 0.6s ease;
      }
      .fleet-card:hover img {
        transform: scale(1.05);
      }
      .scroll-indicator {
        animation: bounce 2s infinite;
      }
      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-10px);
        }
        60% {
          transform: translateY(-5px);
        }
      }
      .route-line {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 3s ease-out forwards;
      }
      @keyframes drawLine {
        to {
          stroke-dashoffset: 0;
        }
      }
      .counter {
        font-variant-numeric: tabular-nums;
      }
      :root {
        --ink: #0f1115;
        --red: #c8102e;
        --gold: #b08d57;
      }
      .font-display {
        font-family: "Fraunces", serif;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--red);
      }
      .eyebrow::before {
        content: "";
        width: 1.5rem;
        height: 1px;
        background: currentColor;
        opacity: 0.55;
      }
      .eyebrow-light {
        color: #f2a3ac;
      }
      .ticket-card {
        position: relative;
        border-radius: 0.75rem;
      }
      .ticket-card::after {
        content: "";
        position: absolute;
        top: 0.75rem;
        bottom: 0.75rem;
        right: 0;
        width: 1px;
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.3) 0,
          rgba(255, 255, 255, 0.3) 5px,
          transparent 5px,
          transparent 10px
        );
      }
      @keyframes heroReveal {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .hero-reveal > * {
        opacity: 0;
        animation: heroReveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .hero-reveal > *:nth-child(1) { animation-delay: 0.05s; }
      .hero-reveal > *:nth-child(2) { animation-delay: 0.16s; }
      .hero-reveal > *:nth-child(3) { animation-delay: 0.27s; }
      .hero-reveal > *:nth-child(4) { animation-delay: 0.38s; }
      .hero-reveal > *:nth-child(5) { animation-delay: 0.49s; }
      @media (prefers-reduced-motion: reduce) {
        .hero-reveal > * {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const Navbar = () => {
          const [isOpen, setIsOpen] = useState(false);
          const [scrolled, setScrolled] = useState(false);

          useEffect(() => {
              const handleScroll = () => setScrolled(window.scrollY > 50);
              window.addEventListener('scroll', handleScroll);
              return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          const menuItems = ['Experience', 'Fleet', 'Destinations', 'Skywards', 'Book'];

          return (
              <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${scrolled ? 'glass-nav shadow-lg' : 'bg-transparent'}`}>
                  <div className="max-w-7xl mx-auto px-6 lg:px-8">
                      <div className="flex items-center justify-between h-20">
                          <div className="flex items-center gap-3">
                              <svg className="w-10 h-10" viewBox="0 0 100 100" fill="none">
                                  <circle cx="50" cy="50" r="45" stroke="#C60C30" strokeWidth="3" fill="white"/>
                                  <path d="M30 55 Q50 30 70 55" stroke="#C60C30" strokeWidth="3" fill="none"/>
                                  <path d="M35 50 L50 35 L65 50" stroke="#C60C30" strokeWidth="2.5" fill="none"/>
                                  <circle cx="50" cy="55" r="4" fill="#C60C30"/>
                              </svg>
                              <span className={`font-display text-2xl font-semibold tracking-tight transition-colors ${scrolled ? 'text-gray-900' : 'text-white'}`}>Emirates</span>
                          </div>

                          <div className="hidden lg:flex items-center gap-8">
                              {menuItems.map((item) => (
                                  <a key={item} href={`#${item.toLowerCase()}`}
                                     className={`text-sm font-medium transition-colors hover:opacity-70 ${scrolled ? 'text-gray-800' : 'text-white'}`}>
                                      {item}
                                  </a>
                              ))}
                              <button className="btn-primary px-6 py-2.5 rounded-full text-white text-sm font-semibold">
                                  Book Now
                              </button>
                          </div>

                          <button className="lg:hidden p-2" onClick={() => setIsOpen(!isOpen)}>
                              {isOpen ?
                                  <i data-lucide="x" className={`w-6 h-6 ${scrolled ? 'text-gray-900' : 'text-white'}`}></i> :
                                  <i data-lucide="menu" className={`w-6 h-6 ${scrolled ? 'text-gray-900' : 'text-white'}`}></i>
                              }
                          </button>
                      </div>
                  </div>

                  {isOpen && (
                      <div className="lg:hidden absolute top-full left-0 right-0 bg-white/95 backdrop-blur-xl shadow-2xl border-t border-gray-100">
                          <div className="px-6 py-6 space-y-1">
                              {menuItems.map((item) => (
                                  <a key={item} href={`#${item.toLowerCase()}`}
                                     onClick={() => setIsOpen(false)}
                                     className="block px-4 py-3 text-gray-800 hover:bg-gray-50 rounded-xl font-medium transition-colors">
                                      {item}
                                  </a>
                              ))}
                              <div className="pt-4">
                                  <button className="w-full btn-primary px-6 py-3 rounded-full text-white font-semibold">
                                      Book Now
                                  </button>
                              </div>
                          </div>
                      </div>
                  )}
              </nav>
          );
      };

      const Hero = () => {
          return (
              <section id="experience" className="relative h-screen overflow-hidden bg-gray-900">
                  <video
                      autoPlay muted loop playsInline preload="metadata"
                      poster="https://images.unsplash.com/photo-1542296332-2e44a4035213?w=1600&q=80"
                      className="absolute inset-0 w-full h-full object-cover">
                      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_091828_e240eb17-6edc-4129-ad9d-98678e3fd238.mp4" type="video/mp4"/>
                  </video>
                  <div className="absolute inset-0 gradient-overlay"></div>

                  <div className="relative h-full flex flex-col justify-end pb-24 md:pb-32">
                      <div className="max-w-7xl mx-auto px-6 lg:px-8 w-full">
                          <div className="max-w-3xl hero-reveal">
                              <p className="eyebrow eyebrow-light mb-5">Fly better</p>
                              <h1 className="font-display text-5xl md:text-7xl lg:text-8xl font-normal italic text-white leading-[0.95] tracking-tight mb-1">
                                  Premium.
                              </h1>
                              <h1 className="font-display text-5xl md:text-7xl lg:text-8xl font-semibold text-white leading-[0.95] tracking-tight">
                                  Redefined.
                              </h1>
                              <p className="text-lg md:text-xl text-gray-200 mt-8 max-w-xl leading-relaxed">
                                  Experience the world's most awarded airline. Where every journey becomes an extraordinary destination in itself.
                              </p>
                              <div className="flex flex-wrap gap-4 mt-10">
                                  <button className="btn-primary px-8 py-3.5 rounded-full text-white font-semibold text-sm">
                                      Discover First Class
                                  </button>
                                  <button className="bg-white/10 backdrop-blur-sm border border-white/30 px-8 py-3.5 rounded-full text-white font-semibold text-sm hover:bg-white/20 transition-all">
                                      Explore Destinations
                                  </button>
                              </div>
                          </div>
                      </div>
                  </div>

                  <div className="absolute bottom-8 left-1/2 -translate-x-1/2 scroll-indicator">
                      <i data-lucide="chevron-down" className="w-6 h-6 text-white/60"></i>
                  </div>
              </section>
          );
      };

      const StatsBar = () => {
          const stats = [
              { value: "160+", label: "Destinations" },
              { value: "85", label: "Countries" },
              { value: "300+", label: "Aircraft" },
              { value: "38M", label: "Skywards Members" },
          ];

          return (
              <div className="py-12" style={{background: 'var(--ink)'}}>
                  <div className="max-w-7xl mx-auto px-6 lg:px-8">
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-8">
                          {stats.map((stat, i) => (
                              <div key={i} className="text-center">
                                  <p className="font-display text-3xl md:text-4xl font-semibold text-white counter">{stat.value}</p>
                                  <p className="text-sm text-gray-400 mt-1 uppercase tracking-wider">{stat.label}</p>
                              </div>
                          ))}
                      </div>
                  </div>
              </div>
          );
      };

      const CabinExperience = () => {
          const cabins = [
              {
                  title: "First Class",
                  subtitle: "Private Suites",
                  description: "Floor-to-ceiling doors, personal minibar, and a fully flat bed. Some suites feature virtual windows with HD cameras relaying real-time views.",
                  features: ["32", "HD Screen", "Shower Spa", "Onboard Lounge", "Mercedes-Benz Seat"],
                  color: "from-amber-900/80 to-amber-950/90",
                  accent: "text-amber-400"
              },
              {
                  title: "Business Class",
                  subtitle: "Lie-Flat Comfort",
                  description: "Staggered 1-2-1 layout with fully flat beds up to 2 metres long. Personal minibar and direct aisle access on every seat.",
                  features: ["23", "HD Screen", "Massage Function", "A380 Onboard Bar", "Privacy Partition"],
                  color: "from-gray-800/80 to-gray-900/90",
                  accent: "text-gray-300"
              },
              {
                  title: "Premium Economy",
                  subtitle: "Elevated Space",
                  description: "Recaro PL3530 seats with 40\" pitch, 8\" recline, and 19.5\" width. Exclusive leather design available on A380 and retrofitted 777s.",
                  features: ["13.3", "Screen", "Extra Legroom", "Priority Boarding", "Enhanced Dining"],
                  color: "from-slate-700/80 to-slate-800/90",
                  accent: "text-slate-300"
              }
          ];

          return (
              <section className="py-24 bg-white">
                  <div className="max-w-7xl mx-auto px-6 lg:px-8">
                      <div className="text-center mb-16">
                          <p className="eyebrow justify-center mb-3">Onboard experience</p>
                          <h2 className="font-display text-4xl md:text-5xl font-semibold text-gray-900">A cabin for every journey</h2>
                          <p className="text-gray-500 mt-4 max-w-2xl mx-auto">From the iconic A380 Shower Spa to our new A350 Business Class, every detail is crafted for your comfort.</p>
                      </div>

                      <div className="grid md:grid-cols-3 gap-6">
                          {cabins.map((cabin, i) => (
                              <div key={i} className="card-hover rounded-2xl overflow-hidden bg-gray-50">
                                  <div className={`h-64 bg-gradient-to-br ${cabin.color} flex items-center justify-center`}>
                                      <div className="text-center px-6">
                                          <p className={`text-sm font-semibold ${cabin.accent} tracking-wider mb-2 uppercase`}>{cabin.subtitle}</p>
                                          <h3 className="text-3xl font-bold text-white">{cabin.title}</h3>
                                      </div>
                                  </div>
                                  <div className="p-8">
                                      <p className="text-gray-600 leading-relaxed mb-6">{cabin.description}</p>
                                      <div className="grid grid-cols-2 gap-3">
                                          {cabin.features.map((f, j) => (
                                              <div key={j} className="flex items-center gap-2 text-sm text-gray-700">
                                                  <i data-lucide="check-circle" className="w-4 h-4 text-red-600"></i>
                                                  {f}
                                              </div>
                                          ))}
                                      </div>
                                  </div>
                              </div>
                          ))}
                      </div>
                  </div>
              </section>
          );
      };

      const FleetSection = () => {
          const fleet = [
              { name: "Airbus A380", role: "Flagship", capacity: "489-615", range: "15,000 km", routes: "London, Sydney, New York, Paris", image: "https://images.unsplash.com/photo-1542296332-2e44a4035213?w=800&q=80" },
              { name: "Airbus A350-900", role: "New Generation", capacity: "298-312", range: "15,000+ km", routes: "Rome, Taipei, Montreal, Adelaide", image: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=800&q=80" },
              { name: "Boeing 777-300ER", role: "Workhorse", capacity: "354-428", range: "14,490 km", routes: "Global Network Coverage", image: "https://images.unsplash.com/photo-1559628233-100c798866d7?w=800&q=80" },
          ];

          return (
              <section id="fleet" className="py-24 bg-gray-50">
                  <div className="max-w-7xl mx-auto px-6 lg:px-8">
                      <div className="text-center mb-16">
                          <p className="eyebrow mb-3">Our fleet</p>
                          <h2 className="font-display text-4xl md:text-5xl font-semibold text-gray-900">Modern. Efficient. Connected.</h2>
                          <p className="text-gray-500 mt-4 max-w-2xl mx-auto">Over 300 aircraft connecting you to 160+ destinations. Every plane equipped with free Starlink Wi-Fi by mid-2027.</p>
                      </div>

                      <div className="grid md:grid-cols-3 gap-8">
                          {fleet.map((plane, i) => (
                              <div key={i} className="fleet-card rounded-xl bg-white border border-gray-200 hover:border-gray-300 overflow-hidden group transition-colors">
                                  <div className="h-56 overflow-hidden">
                                      <img src={plane.image} alt={plane.name} loading="lazy" decoding="async" className="w-full h-full object-cover" />
                                  </div>
                                  <div className="p-6">
                                      <h3 className="font-display text-xl font-semibold text-gray-900">{plane.name}</h3>
                                      <p className="text-xs font-semibold text-red-700 mt-1 mb-4">{plane.role}</p>
                                      <div className="space-y-2 text-sm border-t border-gray-100 pt-4">
                                          <div className="flex justify-between text-gray-500">
                                              <span>Capacity</span>
                                              <span className="counter font-semibold text-gray-900">{plane.capacity} pax</span>
                                          </div>
                                          <div className="flex justify-between text-gray-500">
                                              <span>Range</span>
                                              <span className="counter font-semibold text-gray-900">{plane.range}</span>
                                          </div>
                                          <div className="flex justify-between text-gray-500">
                                              <span>Key routes</span>
                                              <span className="font-semibold text-gray-900 text-right">{plane.routes}</span>
                                          </div>
                                      </div>
                                  </div>
                              </div>
                          ))}
                      </div>

                      <div className="mt-16 border border-gray-200 rounded-2xl p-8 md:p-12">
                          <div className="grid md:grid-cols-2 gap-12 items-center">
                              <div>
                                  <h3 className="font-display text-2xl font-semibold text-gray-900 mb-4">Fleet retrofit program</h3>
                                  <p className="text-gray-600 leading-relaxed mb-6">The largest retrofit program in aviation history. A $5 billion investment to refresh 219 aircraft — 110 A380s and 109 Boeing 777s — with new Premium Economy, refreshed Business Class, and upgraded interiors.</p>
                                  <div className="grid grid-cols-2 gap-4">
                                      <div className="bg-gray-50 rounded-xl p-4">
                                          <p className="font-display text-2xl font-semibold text-red-700">219</p>
                                          <p className="text-sm text-gray-600">Aircraft refreshed</p>
                                      </div>
                                      <div className="bg-gray-50 rounded-xl p-4">
                                          <p className="font-display text-2xl font-semibold text-red-700">$5B</p>
                                          <p className="text-sm text-gray-600">Investment</p>
                                      </div>
                                  </div>
                              </div>
                              <div className="rounded-xl p-8 text-white" style={{background: 'var(--ink)'}}>
                                  <p className="text-sm text-gray-400 mb-2">By end of 2026</p>
                                  <p className="font-display text-3xl font-semibold mb-4">4 million+ Premium Economy seats</p>
                                  <p className="text-gray-300 text-sm leading-relaxed">Premium Economy expanding to 84+ routes by July 2026. 8,512 new Premium Economy seats, 2,034 First Class suites, and 12,720 upgraded Business Class seats being installed fleet-wide.</p>
                              </div>
                          </div>
                      </div>
                  </div>
              </section>
          );
      };

      const DestinationsSection = () => {
          const destinations = [
              { city: "London", country: "United Kingdom", flights: "98 weekly", image: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=600&q=80" },
              { city: "Sydney", country: "Australia", flights: "21 weekly", image: "https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=600&q=80" },
              { city: "New York", country: "USA", flights: "21 weekly", image: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=600&q=80" },
              { city: "Paris", country: "France", flights: "14 weekly", image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=600&q=80" },
              { city: "Singapore", country: "Singapore", flights: "35 weekly", image: "https://images.unsplash.com/photo-1525625293386-3f8f99389edd?w=600&q=80" },
              { city: "Rome", country: "Italy", flights: "14 weekly", image: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=600&q=80" },
          ];

          return (
              <section id="destinations" className="py-24 bg-white">
                  <div className="max-w-7xl mx-auto px-6 lg:px-8">
                      <div className="text-center mb-16">
                          <p className="eyebrow mb-3">Global network</p>
                          <h2 className="font-display text-4xl md:text-5xl font-semibold text-gray-900">160+ destinations, one Dubai</h2>
                          <p className="text-gray-500 mt-4 max-w-2xl mx-auto">From six continents to your next adventure. All routes connect through our world-class hub at Dubai International.</p>
                      </div>

                      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                          {destinations.map((dest, i) => (
                              <div key={i} className="group relative rounded-2xl overflow-hidden h-80 cursor-pointer">
                                  <img src={dest.image} alt={dest.city} loading="lazy" decoding="async" className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                                  <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
                                  <div className="absolute bottom-0 left-0 right-0 p-6">
                                      <p className="text-xs text-white/70 font-medium mb-1">{dest.country}</p>
                                      <h3 className="font-display text-2xl font-semibold text-white">{dest.city}</h3>
                                      <p className="text-sm text-white/80 mt-1">{dest.flights} A380 & 777 flights</p>
                                  </div>
                              </div>
                          ))}
                      </div>

                      <div className="mt-12 text-center">
                          <button className="btn-secondary px-8 py-3 rounded-full font-semibold text-sm">
                              View All Destinations
                          </button>
                      </div>
                  </div>
              </section>
          );
      };

      const SkywardsSection = () => {
          const tiers = [
              { name: "Blue", miles: "0", color: "bg-blue-500", benefits: ["Free Wi-Fi in First/Business", "Waitlist Priority", "Miles Valid 3 Years"] },
              { name: "Silver", miles: "25,000", color: "bg-gray-400", benefits: ["30% Bonus Miles", "Dubai Lounge Access", "Priority Check-in", "Extra 12kg Baggage"] },
              { name: "Gold", miles: "50,000", color: "bg-amber-500", benefits: ["75% Bonus Miles", "Global Lounge Access", "Guaranteed Seats", "Extra 16kg Baggage"] },
              { name: "Platinum", miles: "150,000", color: "bg-red-700", benefits: ["100% Bonus Miles", "First Class Lounges", "Gift Gold Status", "No Miles Expiry", "Home Check-in Dubai"] },
          ];

          return (
              <section id="skywards" className="py-24 text-white" style={{background: 'var(--ink)'}}>
                  <div className="max-w-7xl mx-auto px-6 lg:px-8">
                      <div className="text-center mb-16">
                          <p className="eyebrow eyebrow-light mb-3">Loyalty program</p>
                          <h2 className="font-display text-4xl md:text-5xl font-semibold">Emirates Skywards</h2>
                          <p className="text-gray-400 mt-4 max-w-2xl mx-auto">Join 38 million members worldwide. Earn and redeem miles across flights, hotels, car rentals, and exclusive experiences.</p>
                      </div>

                      <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                          {tiers.map((tier, i) => (

      const App = () => {

                          entry.target.classList.add('visible');
                      }
                  });
              }, { threshold: 0.1 });

              document.querySelectorAll('.section-fade').forEach(el => observer.observe(el));

              return () => observer.disconnect();
